- id: instruction-lint
  name: instruction-lint
  description: Lint agent instruction files (AGENTS.md / CLAUDE.md).
  entry: instruction-lint
  language: python
  # Cross-file rules (R3a/R3b/R3c) read test files, source and docs, so the hook must run on every
  # commit and cannot be filtered by instruction files. The tool analyzes the full tracked set.
  pass_filenames: false
  always_run: true
  minimum_pre_commit_version: '3.0.0'
