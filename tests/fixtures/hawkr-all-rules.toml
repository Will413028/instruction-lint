# All rules configured for the public hawkr repository, at the levels their specs call for
# (error: R2, R3a, R4 dates and issue numbers, R5 ancestor/descendant, C1; warn: R3b, R3c, R6,
# R4 narrative words, R5 siblings). The shipped preset keeps every new rule at warn; this file is
# what a consumer would write to raise them. Used only by the contract leg that reports on a
# pinned checkout; limits come from hawkr-limits.toml.
extends = ["hawkr-limits.toml"]

[rules.R2]
level = "error"

[[rules.R2.shapes]]
glob = "backend/internal/modules/*/AGENTS.md"
sections = ["職責", "擁有的資料", "發布的讀取介面", "模組內部結構", "不變量", "不負責", "決策紀錄"]
mode = "exact"
title = true

[[rules.R2.shapes]]
glob = "backend/internal/modules/*/internal/*/AGENTS.md"
sections = ["不變量"]
mode = "exact"
title = true
purpose = true
bullets_only = ["不變量"]

[rules.R3a]
level = "error"

[rules.R3b]
level = "warn"
base_dirs = ["backend", "website", "admin", "buyer-app", "seller-app", "packages/*", ".github/workflows"]
source_roots = ["src"]
resolve_extensions = [".ts", ".tsx"]
ignore_negated_words = ["沒有", "尚無", "不存在", "已移除"]

[rules.R3c]
level = "warn"
ignore_before = ['設計書\s*$']   # "49 號設計書 §8.1" points at another document

[[rules.R3c.specs]]
glob = "backend/internal/modules/*/AGENTS.md"
spec = "backend/docs/modules/{1}.md"

[[rules.R3c.specs]]
glob = "backend/internal/modules/*/internal/*/AGENTS.md"
spec = "backend/docs/modules/{1}.md"

[rules.R4]
level = "error"

[rules.R5]
level = "error"

[rules.R6]
level = "warn"

[rules.C1]
level = "error"
mode = "forbid"
