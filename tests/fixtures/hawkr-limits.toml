# SNAPSHOT of the limits enforced by the legacy checker in tests/fixtures/legacy-oracle/,
# written as an instruction-lint config. Used only by the contract tests; not maintained.
extends = ["preset:default"]

[discover]
globs = ["AGENTS.md", "**/AGENTS.md"]   # the legacy checker only looked at AGENTS.md

[rules.R1]
level = "error"
max_line_chars = 500
excluded_blocks = [
  { begin = "<!-- BEGIN:nextjs-agent-rules -->", end = "<!-- END:nextjs-agent-rules -->" },
]

# Depth tiers as globs: `*` never crosses `/`, so `*/AGENTS.md` is exactly depth 1; first match wins.
[[rules.R1.limits]]
glob = "AGENTS.md"        # depth 0
max_bytes = 12000

[[rules.R1.limits]]
glob = "*/AGENTS.md"      # depth 1
max_bytes = 10000

[[rules.R1.limits]]
glob = "**/AGENTS.md"     # depth 2 and deeper
max_bytes = 6000
