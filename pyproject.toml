[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instruction-lint"
version = "0.2.0"
description = "A linter for agent instruction files (AGENTS.md / CLAUDE.md), configured by TOML."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
instruction-lint = "instruction_lint.cli:main"

[tool.setuptools.packages.find]
include = ["instruction_lint*"]

[tool.setuptools.package-data]
instruction_lint = ["presets/*.toml", "_vendor/*.txt"]
